<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Multilyrical </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>
        {% include 'header.html' %}

        <h3 id="help-text"> Play or search for a song! </h3>

        <section id="main-ui">
            <div class="song-finder">
                <button id="song-identify">
                    Identify Song
                </button>

                <br><br>

                <form action="/search" method="POST">
                    <input
                        type="text"
                        name="query"
                        id="song-search"
                        placeholder="Search for a song..."
                        required
                    >
                    <button id="search-button">Search</button>
                </form>

                <p id="song-result"> No song identified yet. </p>
            </div>
        </section>
        
        <section id="user-activity">
            <a href="{{ url_for('recently_viewed') }}">
                Recently Viewed
            </a>

            <a href="{{ url_for('saved') }}">
                Favorites
            </a>

            <a href="{{ url_for('playlists') }}">
                Playlists
            </a>
        </section>
        
    </body>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</html>
