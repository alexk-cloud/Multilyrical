<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recently Viewed Songs - Multilyrical</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        {% include 'header.html' %}

        <h1 class="page-title">Recently Viewed Songs</h1>

        <section id="recent-songs">
            {% if recent_songs %}
            {% for song in recent_songs %}
                <div class="song-card">
                    <h3>
                        <a href="{{ url_for('results_by_id', song_id=song.id) }}" class="song-link">
                            <img 
                                src="{{ song.image_url or url_for('static', filename='default-song-image.png') }}" 
                                alt="Album cover for {{ title }}"
                                class="album-art"
                            >
                            {{ song.title }}
                        </a>
                        <p class="artist-name">by {{ song.artist }}</p>
                    </h3>

                    
                </div>
            {% endfor %}

            {% else %}
                <p>You haven't viewed any songs yet.</p>
            {% endif %}
        </section>
    </body>
</html>
