<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Multilyrical - Results </title>
</head>

<body>
    <h1> Song Results </h1>

    <h2> {{ title }} </h2>
    <h3> {{ artist }}</h3>

    <h3> Lyrics </h3>

    {% if lyrics %}
        <div style="white-space: pre-line;"> {{ lyrics }} </div>
    
    {% else %}
        <p> {{ error }} </p>

    {% endif %}
    
    <br>
    
    <a href="/"> Back Home </a>
</body>

</html>
