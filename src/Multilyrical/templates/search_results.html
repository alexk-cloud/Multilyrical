<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Multilyrical - Search Results </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>
        {% include 'header.html' %}

        <h1 class="page-title"> Search Results </h1>
        
        {% if error %}
            <p> {{ error }} </p>
        {% elif results %}
            {% for song in results %}
                <p> 
                    <a href="{{ url_for('results_by_id', song_id=song.id)}}">
                        {{ song.artistName }} - {{ song.trackName }}
                    </a>
                </p>
            {% endfor %}
        {% else %}
            <p> No matching songs found. </p>
        {% endif %}
    </body>
</html>
