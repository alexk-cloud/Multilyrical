<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Multilyrical - Search Results </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>
        {% include 'header.html' %}

        <h1 class="page-title">Search Results for "{{ query }}"</h1>
        
        {% if error %}
            <p> {{ error }} </p>
        {% elif results %}
            {% for song in results %}
                <div class="results-container"> 
                    <div class="results-song">
                        <img
                        src="{{ url_for('static', filename='default-song-image.png') }}"
                        data-artist="{{ song.artistName }}"
                        data-title="{{ song.trackName }}"
                        alt="Album cover"
                        class="results-song-art"
                        loading="lazy"
                        >
                    
                        <div class="results-song-info">
                            <a href="{{ url_for('results_by_id', song_id=song.id)}}" 
                            class="results-song-link">
                                <div class="results-song-title">
                                    {{ song.trackName }}
                                </div>

                                <div class="results-song-artist">
                                    {{ song.artistName }} 
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
                
            {% endfor %}
        {% else %}
            <p> No matching songs found. </p>
        {% endif %}

        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
